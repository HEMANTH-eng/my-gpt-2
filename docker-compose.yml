services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: mygpt-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEVICE=cpu
      - MODEL_CONFIG=gpt_micro
      - CORS_ORIGINS=*
      - LOG_LEVEL=INFO
    volumes:
      - ./checkpoints:/app/checkpoints
      - ./runs:/app/runs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - gpt-net

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: mygpt-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      api:
        condition: service_healthy
    networks:
      - gpt-net

networks:
  gpt-net:
    driver: bridge
