apiVersion: apps/v1
kind: Deployment
metadata:
  name: mygpt-api-deployment
  labels:
    app: mygpt-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mygpt-api
  template:
    metadata:
      labels:
        app: mygpt-api
    spec:
      containers:
      - name: mygpt-api
        image: mygpt-api:latest
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mygpt-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mygpt-api-deployment
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
